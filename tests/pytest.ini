[pytest]
# Este archivo vive en tests/ a proposito: hace que pytest tome tests/ como
# rootdir. Si tomara la raiz del repo, intentaria recolectar el __init__.py del
# plugin (el punto de entrada del arnes) como modulo de test y fallaria con
# "attempted relative import with no known parent package".
#
# Los tests cargan el plugin POR RUTA con importlib (el directorio lleva guiones,
# no es un nombre importable) y lo montan en sys.modules bajo un nombre valido.
addopts = --import-mode=importlib
